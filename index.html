      <guiding-question>Welche Daten zur Lackierung wichtig?</guiding-question>
      <title>Daten zur Lackierung</title>
      <technical-data>
        <item><name>Anzahl der Lackschichten</name><value>3-5 Stück</value></item>
        <item><name>Lackverbrauch 1. Lackschicht</name><value>ca. 0-80 ml/m²</value></item>
        <item><name>Lackverbrauch 2. - max. 5. Lackschicht</name><value>ca. 80-120 ml/m²</value></item>
        <item><name>Lackverbrauch gesamt</name><value>ca. 350 ml/m²</value></item>
        <item><name>Trockenzeit 1. - vorletzte Lackschicht</name><value>ca. 2-3 h (maximal 12 h)</value></item>
        <item><name>Überschrittene Trockenzeit zwischen zwei Lackschichten</name><value>&gt; 24 h Anschleifen notwendig</value></item>
        <item><name>Trockenzeit letze Lackschicht</name><value>ca. 3-5 h</value></item>
        <item><name>Begehbarkeit der Lackierung nach letzter Lackschicht</name><value>ca. 12 h</value></item>
        <item><name>Aushärtezeit der Lackierung</name><value>ca. 48 h</value></item>
        <item><name>Wartezeit bis zur Belastbarkeit der Lackierung</name><value>ca. 2 Wochen</value></item>
        <item><name>Wartezeit bis zur Feuchtreinigung der Lackierung</name><value>ca. 2 Wochen</value></item>
      </technical-data>
      <note type="info">Weitere Informationen finden Sie auf den Produkt-Informationsblättern der verwendeten Hilfsstoffe.</note>
    </section>
    <section id="korkparkett-lackieren" type="task">
      <guiding-question>Was ist bei der Lackierung zu beachten?</guiding-question>
      <title>Korkparkett lackieren</title>
      <note type="warning">VORSICHT Verletzungsgefahr durch den Lack! Allergische Hautreaktionen und Hautschädigungen durch Kontakt mit dem Lack. Halten Sie Werkzeuge sauber. Tragen Sie Ihre persönliche Schutzausrüstung. Entfernen Sie Lacke umgehend nach Haut- oder Augenkontakt.</note>
      <note type="info">HINWEIS Unebene Lackschichten! Beim Lackieren sind Lufteinschlüsse zwischen den Lackschichten oder unebene Oberflächen möglich. Verteilen Sie nasse Lacke besser. Schleifen Sie abgetrocknete Lacke leicht an.</note>
      <prerequisites>
        <item>Sie kennen Arbeitsschritte und Vorgehensweisen um die Korkparkett-Fliesen zu lackieren.</item>
        <item>Sie haben das TKB-Merkblatt 5 gelesen.</item>
        <item>Der Korkparkett muss gereinigt sein.</item>
      </prerequisites>
      <steps>
        <step>Lackieren Sie den Korkparkett, einschließlich aller Nebentätigkeiten.</step>
      </steps>
      <result>Sie haben den Korkparkett lackiert.</result>
    </section>

      <guiding-question>Was ist damit gemeint?</guiding-question>
      <title>Glossar</title>
      <lead>Die verwendeten Benennungen in dieser Anleitung werden verwendet, wie folgt beschrieben:</lead>
      <technical-data>
        <item><name>Ablüftezeit</name><value>Zeitfenster zwischen dem Auftragen des Klebers auf den Boden und dem frühest möglichen Beginn des Verlegens</value></item>
        <item><name>Aushärtezeit</name><value>Bezogen auf Kleber, Fugenmaterial und die Abschließende Aushärtezeit von Lack, nach dem Aufbringen der letzten Lackschicht.</value></item>
        <item><name>Belegreife, belegreif</name><value>Zustand eines Untergrundes, in dem er für die schadens- und mangelfreie, dauerhafte Aufnahme eines Bodenbelags oder einer Beschichtung geeignet ist</value></item>
        <item><name>Einlegezeit</name><value>Zeitfenster für das Verlegen des Bodens - Startet am Ende der Ablüftezeit des Klebers und endet mit dem Aushärten des Klebers</value></item>
        <item><name>Hilfsstoffe</name><value>Alle Produkte, die zum Verlegen, Reinigen und Lackieren des Korkparkett notwendig sind, z.B. Kleber, Lacke usw.</value></item>
        <item><name>Kleberoffenzeit</name><value>Zeitfenster zwischen dem Auftragen des Klebers auf Korkparkett-Fliesen und der Verlegung</value></item>
        <item><name>Trockenzeit</name><value>Bezogen auf Estriche, Spachtelungen, Grundierungen und Lacke - beginnt mit der Fertigstellung bzw. dem Auftragen und endet mit Eintritt der Belegreife, z.B. auch weitere Lackschicht</value></item>
      </technical-data>
    </section>
  </chapter>

  // Menü Toggle Logik
  const menuToggleBtn = document.getElementById('menuToggleBtn');
  const sidebarMenu = document.getElementById('sidebarMenu');

  menuToggleBtn.addEventListener('click', () => {
    sidebarMenu.classList.toggle('open');
  });

  document.addEventListener("DOMContentLoaded", () => {
    fetch("daten.xml")
      .then(res => {
        if (!res.ok) throw new Error("Netzwerkfehler");
        return res.text();
      })
      .then(xmlString => {
        parseAndInit(xmlString);
      })
      .catch(error => {
        parseAndInit(fallbackXML);
      });
  });

  function parseAndInit(xmlString) {
    const parser = new DOMParser();
    globalXMLDoc = parser.parseFromString(xmlString, "application/xml");
    if (globalXMLDoc.getElementsByTagName("parsererror").length > 0) {
      alert("XML-Fehler."); return;
    }
    buildSidebar();
    
    const firstId = globalXMLDoc.getElementsByTagName('chapter')[0].getAttribute('id');
    renderChapter(firstId);
  }

  function buildSidebar() {
    const navList = document.getElementById('sidebarNav');
    navList.innerHTML = '';
    
    const chapters = globalXMLDoc.getElementsByTagName('chapter');
    Array.from(chapters).forEach(chapter => {
      const id = chapter.getAttribute('id');
      const num = chapter.getElementsByTagName('number')[0]?.textContent || '';
      const title = chapter.getElementsByTagName('title')[0]?.textContent || '';
      
      const li = document.createElement('li');
      li.className = 'nav-item';
      li.id = 'nav-' + id;
      li.innerHTML = `<span class="nav-num">${num}</span><span class="nav-title">${title}</span>`;
      
      li.addEventListener('click', () => {
        renderChapter(id);
        // Menü auf mobilen Geräten nach dem Klicken schließen
        if (window.innerWidth <= 768) {
          sidebarMenu.classList.remove('open');
        }
      });
      navList.appendChild(li);
    });
  }

  function renderChapter(chapterId) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById('nav-' + chapterId)?.classList.add('active');

    const output = document.getElementById('manualOutput');
    output.innerHTML = '';

    const chapters = Array.from(globalXMLDoc.getElementsByTagName('chapter'));
    const targetChapter = chapters.find(ch => ch.getAttribute('id') === chapterId);
    
    if (!targetChapter) return;

    const num = targetChapter.getElementsByTagName('number')[0]?.textContent || '';
    const title = targetChapter.getElementsByTagName('title')[0]?.textContent || '';
    const icon = targetChapter.getElementsByTagName('icon')[0]?.textContent || '';
    
    const header = document.createElement('div');
    header.className = 'chapter-header';
    
    let headerHTML = '';
    if (icon) {
      headerHTML += `<img src="${icon}" class="chapter-header-icon" alt="Kapitel Icon">`;
    }
    headerHTML += `<div>`;
    if(num) {
      headerHTML += `<div class="chapter-number-large">Kapitel ${num}</div>`;
    }
    headerHTML += `<h2 class="chapter-title">${title}</h2></div>`;
    
    header.innerHTML = headerHTML;
    output.appendChild(header);

    const sections = targetChapter.getElementsByTagName('section');
    Array.from(sections).forEach(section => {
      const card = document.createElement('article');
      card.className = 'card';

      const question = section.getElementsByTagName('guiding-question')[0]?.textContent;
      if (question) card.innerHTML += `<span class="guiding-question">${question}</span>`;

      const secTitle = section.getElementsByTagName('title')[0]?.textContent;
      if (secTitle) card.innerHTML += `<h3 class="section-title">${secTitle}</h3>`;

      const notesNodes = section.getElementsByTagName('note');
      Array.from(notesNodes).forEach(note => {
        const type = note.getAttribute('type') === 'warning' ? 'note-warning' : 'note-info';
        
        let noteContent = '';
        if (type === 'note-warning') {
          noteContent = `<img src="Icon-Vorsicht.png" class="warning-icon" alt="Achtung"> <div>${note.textContent}</div>`;
        } else {
          noteContent = `<div>${note.textContent}</div>`;
        }
        
        card.innerHTML += `<div class="${type}">${noteContent}</div>`;
      });

      const mediaNodes = section.getElementsByTagName('media');
      Array.from(mediaNodes).forEach(media => {
        if (media.getAttribute('type') === 'video') {
          const src = media.getAttribute('src');
          let videoHTML = '';
          
          if (src.includes('http')) {
             let embedUrl = src;
             if (src.includes('drive.google.com') && src.includes('/view')) {
               embedUrl = src.replace(/\/view.*$/, '/preview');
             } else if (src.includes('watch?v=')) {
               embedUrl = src.replace('watch?v=', 'embed/');
             }
             videoHTML = `<iframe src="${embedUrl}" allow="autoplay" allowfullscreen loading="lazy"></iframe>`;
          } else {
             videoHTML = `<video controls style="width: 100%; height: 100%; object-fit: cover;"><source src="${src}" type="video/mp4">Ihr Browser unterstützt keine Videos.</video>`;
          }

          card.innerHTML += `
            <div class="video-container">
              ${videoHTML}
            </div>
            ${media.getAttribute('caption') ? `<p style="font-size:0.85rem; color:#64748b; text-align:center;">${media.getAttribute('caption')}</p>` : ''}
          `;
        } else if (media.getAttribute('type') === 'image') {
          const src = media.getAttribute('src');
          const caption = media.getAttribute('caption');
          const isQR = src.includes('QR'); // Kleineres Bild für QR Code
          
          card.innerHTML += `
            <div class="image-container" style="text-align: center; margin: 1rem 0;">
              <img src="${src}" alt="${caption || ''}" style="max-width: ${isQR ? '180px' : '100%'}; border-radius: 8px;">
            </div>
            ${caption ? `<p style="font-size:0.85rem; color:#64748b; text-align:center; font-style:italic;">${caption}</p>` : ''}
          `;
        } else if (media.getAttribute('type') === 'pdf') {
          const src = media.getAttribute('src');
          const caption = media.getAttribute('caption') || 'PDF herunterladen';
          
          card.innerHTML += `
            <div style="margin: 1.5rem 0; display: flex; flex-direction: column; gap: 1rem;">
              <a href="${src}" target="_blank" download style="display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; background-color: var(--primary); color: white; padding: 0.75rem 1.25rem; border-radius: 6px; text-decoration: none; font-weight: 600; width: fit-content;">
                📄 ${caption} (Download)
              </a>
              <div style="width: 100%; height: 600px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;">
                <iframe src="${src}" style="width: 100%; height: 100%; border: none;">
                  Ihr Browser unterstützt keine eingebetteten PDFs. Bitte nutzen Sie den Download-Button.
                </iframe>
              </div>
            </div>
          `;
        }
      });

      const leadNodes = section.getElementsByTagName('lead');
      Array.from(leadNodes).forEach(lead => {
         card.innerHTML += `<p class="lead-text">${lead.textContent}</p>`;
      });

      const techData = section.getElementsByTagName('technical-data')[0];
      if (techData) {
        let tbl = `<table class="tech-table"><thead><tr><th>Benennung / Eigenschaft</th><th>Wert / Einheit</th></tr></thead><tbody>`;
        Array.from(techData.getElementsByTagName('item')).forEach(item => {
          const nameText = item.getElementsByTagName('name')[0]?.textContent || '';
          const valText = item.getElementsByTagName('value')[0]?.textContent || '';
          tbl += `<tr><td>${nameText}</td><td><strong>${valText}</strong></td></tr>`;
        });
        tbl += `</tbody></table>`;
        card.innerHTML += tbl;
      }

      const prereqs = section.getElementsByTagName('prerequisites')[0];
      if (prereqs) {
        let ul = `<div class="prereq-block"><ul>`;
        Array.from(prereqs.getElementsByTagName('item')).forEach(p => ul += `<li>${p.textContent}</li>`);
        ul += `</ul></div>`;
        card.innerHTML += ul;
      }

      const stepsNode = section.getElementsByTagName('steps')[0];
      if (stepsNode) {
        let ol = `<ol class="step-list">`;
        Array.from(stepsNode.getElementsByTagName('step')).forEach(st => ol += `<li>${st.textContent}</li>`);
        ol += `</ol>`;
        card.innerHTML += ol;
      }

      const listNode = section.getElementsByTagName('list')[0];
      if (listNode) {
        let ul = `<ul class="concept-list">`;
        Array.from(listNode.getElementsByTagName('item')).forEach(it => ul += `<li>${it.textContent}</li>`);
        ul += `</ul>`;
        card.innerHTML += ul;
      }

      const result = section.getElementsByTagName('result')[0]?.textContent;
      if (result) card.innerHTML += `<div class="result-block">${result}</div>`;

      output.appendChild(card);
      
      // Zurück nach ganz oben scrollen, wenn ein neues Kapitel geladen wird
      document.getElementById('mainContent').scrollTop = 0;
    });
  }
</script>
